<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ultimate Football Tippspiel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg: #f7f6f2; --surface: #ffffff; --surface2: #f0eeea;
  --border: rgba(0,0,0,.10); --border2: rgba(0,0,0,.18);
  --text: #1a1a18; --muted: #6b6a66; --hint: #9c9b97;
  --green: #2d7a3a; --green-bg: #e8f5eb;
  --amber: #8a5a00; --amber-bg: #fff3d6;
  --blue: #1a5fa8;  --blue-bg: #e4effe;
  --red: #b52a2a;   --red-bg: #fdeaea;
  --r-md: 10px; --r-lg: 14px; --r-xl: 18px;
  --shadow: 0 1px 3px rgba(0,0,0,.08);

  /* Competition Default Theme (Bundesliga Red) */
  --comp-primary: #d0021b;
  --comp-accent: #f5a623;
  --comp-bg-light: #fdeaea;
}

body[data-theme="dfb"] {
  --comp-primary: #008744;
  --comp-accent: #d4af37;
  --comp-bg-light: #e8f5eb;
}

body[data-theme="cl"] {
  --comp-primary: #001438;
  --comp-accent: #00f0ff;
  --comp-bg-light: #e4effe;
}

@media(prefers-color-scheme:dark){
  :root {
    --bg: #0d0e12; --surface: #161820; --surface2: #202330;
    --border: rgba(255,255,255,.10); --border2: rgba(255,255,255,.18);
    --text: #f0efe9; --muted: #9c9b97; --hint: #6b6a66;
    --green: #5ec96a; --green-bg: #1a3320;
    --amber: #f0b940; --amber-bg: #2e2200;
    --blue: #6aadff;  --blue-bg: #0d1e35;
    --red: #f07070;   --red-bg: #2e1111;
  }
}

html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-text-size-adjust:100%}
input,button{font-family:inherit;font-size:inherit}button{cursor:pointer}

.app{max-width:480px;margin:0 auto;padding:0 0 80px}

/* Header & Switcher */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:50;display:flex;flex-direction:column;gap:10px}
.header-top{display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:800;letter-spacing:-.3px;color:var(--comp-primary);transition:color .3s}

.comp-selector{display:flex;background:var(--surface2);padding:3px;border-radius:var(--r-md);gap:3px}
.comp-btn{flex:1;padding:7px 4px;border:none;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);background:transparent;transition:all .2s}
.comp-btn.active{background:var(--comp-primary);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}

.user-pill{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 10px 5px 6px;font-size:13px;font-weight:500}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--comp-primary);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom);width:100%;max-width:480px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;font-size:10px;color:var(--hint);border:none;background:none;transition:color .15s}
.nav-item.active{color:var(--comp-primary)}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.section{display:none;padding:16px}.section.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-title{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}

.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.input{width:100%;padding:12px 14px;border:1.5px solid var(--border2);border-radius:var(--r-md);background:var(--surface2);color:var(--text);font-size:15px;outline:none;transition:border-color .2s}
.input:focus{border-color:var(--comp-primary)}

.btn{width:100%;padding:13px;border-radius:var(--r-md);border:none;font-size:15px;font-weight:700;transition:all .15s}
.btn-primary{background:var(--comp-primary);color:#fff}.btn-primary:active{opacity:.85;transform:scale(.98)}

.gtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.gtabs::-webkit-scrollbar{display:none}
.gtab{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid var(--border2);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600}
.gtab.active{background:var(--comp-primary);color:#fff;border-color:var(--comp-primary)}

.match-item{padding:12px 0;border-bottom:1px solid var(--border)}
.match-item:last-child{border-bottom:none}
.match-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.match-date{font-size:11px;color:var(--hint)}
.match-teams{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;gap:6px}
.team-name{font-size:13px;font-weight:700;line-height:1.2}
.team-cell{display:flex;flex-direction:column}
.team-cell.home{align-items:flex-end;text-align:right}
.team-cell.away{align-items:flex-start;text-align:left}

.score-box{display:flex;align-items:center;justify-content:center;gap:5px}
.score-in{width:36px;height:36px;text-align:center;font-size:17px;font-weight:800;border:1.5px solid var(--border2);border-radius:8px;background:var(--surface2);color:var(--text);padding:0}
.score-in:focus{outline:none;border-color:var(--comp-primary)}
.live-result{background:var(--comp-primary);color:#fff;border-radius:8px;padding:4px 10px;font-size:16px;font-weight:800;text-align:center;min-width:54px}

.chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px}
.chip-4{background:var(--green-bg);color:var(--green)}
.chip-3{background:var(--blue-bg);color:var(--blue)}
.chip-2{background:var(--amber-bg);color:var(--amber)}
.chip-0{background:var(--surface2);color:var(--hint)}
.chip-live{background:var(--red-bg);color:var(--red)}

.rank-row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--border);position:relative}
.rank-pos{width:22px;font-size:14px;font-weight:800;text-align:center}
.rank-name{flex:1;font-size:15px;font-weight:600}
.rank-pts-val{font-size:17px;font-weight:800;text-align:right}
.rank-row.me{background:var(--comp-bg-light);border-radius:var(--r-md);font-weight:700}

.bonus-item{margin-bottom:14px}
.bonus-label{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.bonus-pts{font-size:11px;background:var(--comp-bg-light);color:var(--comp-primary);padding:2px 8px;border-radius:10px;font-weight:700}

.live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite;display:inline-block;margin-right:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;font-weight:600;z-index:999;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.toast.show{transform:translateX(-50%) translateY(0)}
.loader{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
</style>
</head>
<body data-theme="bl1">

<div id="login-screen" style="display:none">
  <div class="login-wrap">
    <div style="font-size:52px">⚽</div>
    <div style="font-size:26px;font-weight:800">Tippspiel 2024/25</div>
    <div style="font-size:14px;color:var(--muted);text-align:center">Bundesliga · DFB-Pokal · Champions League</div>
    <div class="login-card">
      <div style="font-size:14px;font-weight:700">Dein Nickname</div>
      <input class="input" id="nick-input" type="text" placeholder="z.B. Alex" maxlength="20" />
      <button class="btn btn-primary" onclick="doLogin()">Starten →</button>
    </div>
  </div>
</div>

<div id="main-app" style="display:none">
  <div class="app">
    <div class="header">
      <div class="header-top">
        <h1 id="app-title">Bundesliga Tippspiel</h1>
        <div class="user-pill" onclick="confirmLogout()" style="cursor:pointer">
          <div class="avatar" id="hdr-av">?</div>
          <span id="hdr-nick">—</span>
        </div>
      </div>
      <div class="comp-selector">
        <button class="comp-btn active" id="btn-bl1" onclick="setCompetition('bl1')">Bundesliga</button>
        <button class="comp-btn" id="btn-dfb" onclick="setCompetition('dfb')">DFB-Pokal</button>
        <button class="comp-btn" id="btn-cl" onclick="setCompetition('cl')">Champions League</button>
      </div>
    </div>

    <!-- HOME SECTION -->
    <div class="section active" id="sec-home">
      <div style="font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;margin-bottom:10px">LIVE & HEUTE</div>
      <div id="home-matches"><div class="loader">Lade Spiele…</div></div>
    </div>

    <!-- TIPPS SECTION -->
    <div class="section" id="sec-tipps">
      <div class="gtabs" id="gtabs"></div>
      <div class="card" style="padding:0 16px">
        <div id="group-matches"><div class="loader">Lade Spieltag…</div></div>
      </div>
    </div>

    <!-- BONUS SECTION -->
    <div class="section" id="sec-bonus">
      <div class="card" id="bonus-card-content">
        <!-- Dynamische Boni Inhalte -->
      </div>
    </div>

    <!-- RANGLISTE SECTION -->
    <div class="section" id="sec-rangliste">
      <div class="card">
        <div class="card-title">Gesamtrangliste</div>
        <div id="ranking-list"><div class="loader">Lade Tabelle…</div></div>
      </div>
    </div>

    <!-- NAV -->
    <nav class="bottom-nav">
      <button class="nav-item active" id="nav-home" onclick="switchSec('home',this)">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home
      </button>
      <button class="nav-item" id="nav-tipps" onclick="switchSec('tipps',this)">
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Tipps
      </button>
      <button class="nav-item" id="nav-bonus" onclick="switchSec('bonus',this)">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>Boni
      </button>
      <button class="nav-item" id="nav-rangliste" onclick="switchSec('rangliste',this)">
        <svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>Rangliste
      </button>
    </nav>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// SUPABASE ZUGANGSDATEN DEINES NEUEN PROJEKTS
const SB_URL = 'https://rhjliwmewxxaeterinet.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoamxpd21ld3h4YWV0ZXJpbmV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NTYxODUsImV4cCI6MjEwMzIzMjE4NX0.jKKbKtBPXnWSatqfGCOMtcA7ch-Jtd5vBx_4NEZga38';

let sb=null, player=null;
let myTipps={}, dbMatches=[];
let currentComp='bl1', activeMatchDay=1;

const BONUS_CONFIGS = {
  bl1: [
    { id: 'bl1_meister', label: '🏆 Deutscher Meister', placeholder: 'z.B. FC Bayern München' },
    { id: 'bl1_vizemeister', label: '🥈 Vizemeister', placeholder: 'z.B. Bayer Leverkusen' },
    { id: 'bl1_dritter', label: '🥉 3. Platz', placeholder: 'z.B. Borussia Dortmund' },
    { id: 'bl1_absteiger18', label: '📉 Direktabsteiger (Platz 18)', placeholder: 'z.B. VfL Bochum' },
    { id: 'bl1_absteiger17', label: '📉 Direktabsteiger (Platz 17)', placeholder: 'z.B. Holstein Kiel' },
    { id: 'bl1_relegation16', label: '⚔️ Relegation (Platz 16)', placeholder: 'z.B. FC St. Pauli' },
    { id: 'bl1_torschuetze', label: '👟 Torschützenkönig', placeholder: 'z.B. Harry Kane' },
    { id: 'bl1_assists', label: '🎯 Meiste Assists', placeholder: 'z.B. Jamal Musiala' },
    { id: 'bl1_keeper', label: '🧤 Bester Torwart', placeholder: 'z.B. Manuel Neuer' }
  ],
  dfb: [
    { id: 'dfb_sieger', label: '🏆 DFB-Pokalsieger', placeholder: 'z.B. Bayer Leverkusen' },
    { id: 'dfb_finalist', label: '🥈 DFB-Pokal Finalist', placeholder: 'z.B. VfB Stuttgart' },
    { id: 'dfb_ueberraschung', label: '💣 Außenseiter im Halbfinale', placeholder: 'z.B. 1. FC Saarbrücken' },
    { id: 'dfb_torschuetze', label: '👟 Pokal-Torschützenkönig', placeholder: 'z.B. Deniz Undav' }
  ],
  cl: [
    { id: 'cl_sieger', label: '🏆 Champions-League-Sieger', placeholder: 'z.B. Real Madrid' },
    { id: 'cl_finalist', label: '🥈 CL-Finalist', placeholder: 'z.B. Manchester City' },
    { id: 'cl_bestes_deutsches_team', label: '🇩🇪 Bestes deutsches Team', placeholder: 'z.B. FC Bayern München' },
    { id: 'cl_torschuetze', label: '👟 CL-Torschützenkönig', placeholder: 'z.B. Kylian Mbappé' },
    { id: 'cl_assists', label: '🎯 CL-Assistkönig', placeholder: 'z.B. Vinícius Júnior' },
    { id: 'cl_mvp', label: '⭐ CL MVP (Bester Spieler)', placeholder: 'z.B. Jude Bellingham' }
  ]
};

window.addEventListener('DOMContentLoaded', async () => {
  sb = supabase.createClient(SB_URL, SB_KEY);
  const saved = localStorage.getItem('tipp_player');
  if(saved){ player = JSON.parse(saved); await startApp(); }
  else show('login-screen');
});

function show(id){
  document.getElementById('login-screen').style.display = id==='login-screen'?'block':'none';
  document.getElementById('main-app').style.display = id==='main-app'?'block':'none';
}

async function doLogin(){
  const nick = document.getElementById('nick-input').value.trim();
  if(!nick || nick.length < 2){ toast('Name zu kurz'); return; }
  let { data: p } = await sb.from('players').select('*').eq('nick', nick).single();
  if(!p){
    const { data: np } = await sb.from('players').insert({ nick }).select().single();
    p = np;
  }
  player = p;
  localStorage.setItem('tipp_player', JSON.stringify(p));
  await startApp();
}

function confirmLogout(){
  if(confirm(`Als "${player?.nick || ''}" abmelden?`)) doLogout();
}

function doLogout(){
  localStorage.removeItem('tipp_player');
  player = null;
  myTipps = {};
  dbMatches = [];
  document.getElementById('nick-input').value = '';
  show('login-screen');
}

async function startApp(){
  show('main-app');
  document.getElementById('hdr-nick').textContent = player.nick;
  document.getElementById('hdr-av').textContent = player.nick.charAt(0).toUpperCase();
  await Promise.all([loadMatches(), loadMyTipps(), loadBonus()]);
  setCompetition('bl1');
}

function setCompetition(comp) {
  currentComp = comp;
  document.body.setAttribute('data-theme', comp);
  document.querySelectorAll('.comp-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-${comp}`).classList.add('active');

  const titles = { bl1: 'Bundesliga Tippspiel', dfb: 'DFB-Pokal Tippspiel', cl: 'Champions League' };
  document.getElementById('app-title').textContent = titles[comp];

  buildMatchdayTabs();
  renderCurrentMatchday();
  renderBonusSection();
  renderHome();
}

async function loadMatches(){
  const { data } = await sb.from('matches').select('*').order('kickoff_utc');
  if(data) dbMatches = data;
}

async function loadMyTipps(){
  const { data } = await sb.from('tipps').select('*').eq('player_id', player.id);
  myTipps = {};
  (data||[]).forEach(t => { myTipps[t.match_id] = { h: t.home_score, a: t.away_score }; });
}

async function loadBonus(){
  const { data } = await sb.from('bonus_tipps').select('*').eq('player_id', player.id).single();
  if(data) Object.assign(myTipps, data);
}

function buildMatchdayTabs(){
  const compMatches = dbMatches.filter(m => m.competition === currentComp);
  const days = [...new Set(compMatches.map(m => m.match_day))].sort((a,b)=>a-b);
  activeMatchDay = days[0] || 1;

  const container = document.getElementById('gtabs');
  container.innerHTML = days.map(d =>
    `<button class="gtab ${d===activeMatchDay?'active':''}" onclick="switchMatchday(${d})">Spieltag ${d}</button>`
  ).join('');
}

function switchMatchday(day){
  activeMatchDay = day;
  document.querySelectorAll('.gtab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderCurrentMatchday();
}

function renderCurrentMatchday(){
  const matches = dbMatches.filter(m => m.competition === currentComp && m.match_day === activeMatchDay);
  const el = document.getElementById('group-matches');
  if(!matches.length){ el.innerHTML = '<div class="loader">Keine Spiele gefunden</div>'; return; }
  el.innerHTML = matches.map(m => renderMatchRow(m)).join('');
}

function renderMatchRow(m){
  const tip = myTipps[m.match_id] || { h: '', a: '' };
  const isDone = m.status === 'FT';
  const isLive = m.status === 'live';
  const pts = (isDone || isLive) && m.home_score !== null ? calcPts(tip, { h: m.home_score, a: m.away_score }) : null;

  const ptsChip = pts === 4 ? `<span class="chip chip-4">+4 Exakt</span>` : pts === 3 ? `<span class="chip chip-3">+3 Diff</span>` : pts === 2 ? `<span class="chip chip-2">+2 Tend</span>` : pts === 0 ? `<span class="chip chip-0">+0</span>` : '';
  const liveLabel = isLive ? `<span class="live-dot"></span>` : '';

  return `<div class="match-item">
    <div class="match-top"><span class="match-date">${liveLabel}${new Date(m.kickoff_utc).toLocaleString('de',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span>${ptsChip}</div>
    <div class="match-teams">
      <div class="team-cell home"><span class="team-name">${m.home_team}</span></div>
      ${isDone || isLive ? `<div class="live-result">${m.home_score ?? '–'}:${m.away_score ?? '–'}</div>` :
      `<div class="score-box">
        <input class="score-in" type="number" min="0" value="${tip.h??''}" id="m_${m.match_id}_h" oninput="saveTipp(${m.match_id})" placeholder="-">
        <span>:</span>
        <input class="score-in" type="number" min="0" value="${tip.a??''}" id="m_${m.match_id}_a" oninput="saveTipp(${m.match_id})" placeholder="-">
      </div>`}
      <div class="team-cell away"><span class="team-name">${m.away_team}</span></div>
    </div>
  </div>`;
}

async function saveTipp(mid){
  const h = parseInt(document.getElementById(`m_${mid}_h`).value);
  const a = parseInt(document.getElementById(`m_${mid}_a`).value);
  if(isNaN(h) || isNaN(a)) return;
  myTipps[mid] = { h, a };
  await sb.from('tipps').upsert({ player_id: player.id, match_id: mid, home_score: h, away_score: a }, { onConflict: 'player_id,match_id' });
}

function renderBonusSection(){
  const container = document.getElementById('bonus-card-content');
  const config = BONUS_CONFIGS[currentComp];
  let html = `<div class="card-title">Wettbewerb Bonus-Tipps <span style="color:var(--comp-primary)">je +5 Pkt</span></div>`;

  config.forEach(item => {
    const val = myTipps[item.id] || '';
    html += `<div class="bonus-item">
      <div class="bonus-label">${item.label} <span class="bonus-pts">+5 Pkt</span></div>
      <input class="input" id="${item.id}" value="${val}" oninput="saveBonusField('${item.id}', this.value)" placeholder="${item.placeholder}" />
    </div>`;
  });
  container.innerHTML = html;
}

let bonusTimer;
function saveBonusField(col, val){
  clearTimeout(bonusTimer);
  bonusTimer = setTimeout(async () => {
    myTipps[col] = val.trim();
    await sb.from('bonus_tipps').upsert({ player_id: player.id, [col]: val.trim() }, { onConflict: 'player_id' });
  }, 700);
}

async function renderRanking(){
  const { data } = await sb.from('rangliste').select('*');
  const el = document.getElementById('ranking-list');
  if(!data) return;
  el.innerHTML = data.map((r, i) => `
    <div class="rank-row ${r.nick===player.nick?'me':''}">
      <span class="rank-pos">${i+1}</span>
      <span class="rank-name">${r.nick}</span>
      <span class="rank-pts-val">${r.punkte} Pkt</span>
    </div>`).join('');
}

function calcPts(tip, res){
  if(tip.h === '' || tip.h === null || tip.h === undefined) return null;
  if(tip.h === res.h && tip.a === res.a) return 4;
  if((tip.h - tip.a) === (res.h - res.a)) return 3;
  if((tip.h > tip.a && res.h > res.a) || (tip.h < tip.a && res.h < res.a) || (tip.h === tip.a && res.h === res.a)) return 2;
  return 0;
}

function renderHome(){
  const active = dbMatches.filter(m => m.competition === currentComp && m.status === 'live');
  const el = document.getElementById('home-matches');
  if(!active.length){ el.innerHTML = '<div class="card" style="text-align:center;color:var(--muted)">Keine Live-Spiele aktuell</div>'; }
  else { el.innerHTML = active.map(m => renderMatchRow(m)).join(''); }
}

function switchSec(sec, btn){
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById(`sec-${sec}`).classList.add('active');
  btn.classList.add('active');
  if(sec==='rangliste') renderRanking();
}

function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}
</script>
</body>
